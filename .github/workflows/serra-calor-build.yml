name: Serra & Calor ROM build

on:
  push:
    branches: [serra-region-foundation]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-gba-roms:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build FireRed (modern toolchain)
        run: make -j2 firered_modern

      - name: Build LeafGreen (modern toolchain)
        run: make -j2 leafgreen_modern

      - name: Publish ROM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serra-calor-gba-roms
          path: |
            pokefirered.gba
            pokeleafgreen.gba
          if-no-files-found: error
          retention-days: 14
